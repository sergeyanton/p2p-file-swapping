[package]
name = "p2p-file-swapping-assignment2"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.44.0", features = ["full"] }
futures = "0.3.31"
clap = { version = "4.5.32", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }

[dependencies.libp2p]
version = "0.55"
features = [
    "tokio",
    "tcp",
    "noise",
    "yamux",
    "macros",
    "request-response",
    "cbor",
]